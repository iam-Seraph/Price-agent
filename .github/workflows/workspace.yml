name: Workspace regression tests
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "price_agent_workspace.py"
      - "src/**"
      - "data/**"
      - ".github/workflows/workspace.yml"
      - "README.md"
      - "docs/**"
      - "site/**"
      - "scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "price_agent_workspace.py"
      - "src/**"
      - "data/**"
      - ".github/workflows/workspace.yml"
      - "README.md"
      - "docs/**"
      - "site/**"
      - "scripts/**"
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full workspace test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-workspace.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run complete offline release validation
        run: python scripts/full_check.py
