name: Phase 5 catalog regression tests

on:
  pull_request:
  push:
    branches:
      - feat/phase5-real-product-catalog

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and dashboard dependencies
        run: python -m pip install -r backend/requirements-dashboard.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/price_engine backend/tests
      - name: Run backend test suite
        working-directory: backend
        run: python -m unittest discover -s tests -v
